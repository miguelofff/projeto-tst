<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <img class="brand-logo" src="/assets/logo.png" alt="Logo" />
      <h1>Acesse sua conta</h1>
      <p>Digite seu usuário e senha para acessar a plataforma</p>
    </div>

    <form (ngSubmit)="fazerLogin()" class="login-form">

      <label>
        <span>Usuário</span>
        <input [(ngModel)]="usuario" name="usuario" type="text" placeholder="Digite seu usuário" required />
      </label>

      <label>
        <span>Senha</span>
        <input [(ngModel)]="senha" name="senha" type="password" placeholder="Insira sua senha" required />
      </label>

      <button type="submit">Entrar</button>
      <a class="forgot-link" href="#">Recuperar Senha</a>
    </form>

    <p class="terms">
      Ao continuar, você concorda com nossos <a href="#">Termos de Serviço</a> e <a href="#">Política de Privacidade</a>
    </p>
  </div>
</div>
